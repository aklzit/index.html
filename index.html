<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Eyes</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050505;
  color: #00ffcc;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: monospace;
  overflow: hidden;
}

.container {
  text-align: center;
}

.eyes {
  font-size: clamp(16px, 5vw, 36px);
  white-space: pre;
  text-shadow: 0 0 10px #00ffcc;
  animation: glow 2s infinite alternate;
}

.label {
  margin-top: 30px;
  color: #777;
  letter-spacing: 5px;
  font-size: 12px;
}

button {
  margin-top: 25px;
  padding: 12px 25px;
  background: transparent;
  border: 1px solid #00ffcc;
  color: #00ffcc;
  border-radius: 8px;
  font-family: monospace;
  cursor: pointer;
}

button:hover {
  background: #00ffcc;
  color: black;
}

@keyframes glow {
  from { text-shadow: 0 0 5px #00ffcc; }
  to { text-shadow: 0 0 20px #00ffcc; }
}
</style>
</head>

<body>

<div class="container">
  <div class="eyes" id="eyes">
   ◉       ◉
  </div>

  <div class="label">ASCII EYES</div>

  <button onclick="blink()">BLINK</button>
</div>

<script>
const eyes = document.getElementById("eyes");

const openEyes = `
  ◉       ◉
`;

const closedEyes = `
  ─       ─
`;

function blink() {
  eyes.textContent = closedEyes;
  setTimeout(() => {
    eyes.textContent = openEyes;
  }, 180);
}

setInterval(blink, 3500);
</script>

</body>
</html>
